[project]
name = "mastodon-charm"
version = "0.0"
description = "Juju machine charm for the Mastodon federated social network server."
requires-python = ">=3.12"
dependencies = [
    "ops>=3.8.1,<4",
    "jinja2>=3.1",
    "cryptography>=50.0.0",
    "charmlibs-apt~=1.0",
    "charmlibs-passwd~=1.0",
    "charmlibs-systemd~=1.0",
    # For charms.grafana_agent.v0.cos_agent
    "cosl>=1.10.2",
    "pydantic>=2",
    # For charms.smtp_integrator.v0.smtp
    "email-validator>=2",
]

[dependency-groups]
dev = [
    "ops[testing]",
    "pytest",
    "coverage[toml]",
    "ruff>=0.16.2",
    "pyright",
    "zizmor>=1.28.0",
]
integration = [
    "pytest",
    "jubilant",
    "pytest-jubilant",
]

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
pythonpath = ["src", "lib"]

[tool.coverage.run]
branch = true
omit = ["lib/*", "tests/*"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
include = ["src"]
extraPaths = ["src", "lib"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingModuleSource = false

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = [
    "lib",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "C4",
    "N",
    "D",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "E203",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
