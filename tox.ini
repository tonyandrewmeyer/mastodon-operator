[tox]
no_package = True
skip_missing_interpreters = True
env_list = lint, unit
requires =
    tox-uv

[vars]
src_path = {tox_root}/src
tests_path = {tox_root}/tests
all_path = {[vars]src_path} {[vars]tests_path}

[testenv]
runner = uv-venv-lock-runner
dependency_groups = dev
set_env =
    PYTHONPATH = {tox_root}/lib:{[vars]src_path}
    PYTHONBREAKPOINT=pdb.set_trace
    PY_COLORS=1
pass_env =
    PYTHONPATH
    CHARM_BUILD_DIR
    MODEL_SETTINGS

[testenv:format]
description = Apply coding style standards to code
commands =
    ruff format {[vars]all_path}
    ruff check --fix {[vars]all_path}

[testenv:lint]
description = Check code style and types
commands =
    ruff check {[vars]all_path}
    ruff format --check --diff {[vars]all_path}
    pyright --pythonpath {env_python}

[testenv:unit]
description = Run unit tests
commands =
    coverage run --source={[vars]src_path} -m pytest \
        --tb native -v -s {posargs} {[vars]tests_path}/unit
    coverage report

[testenv:integration]
description = Run integration tests (requires a bootstrapped Juju controller)
dependency_groups = integration
commands =
    pytest -v -s --tb native --log-cli-level=INFO {posargs} {[vars]tests_path}/integration
