name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install tox
        run: |
          pipx install tox
          pipx inject tox tox-uv
      - name: Run linters
        run: tox -e lint

  lock-sync:
    name: Lockfile sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install uv
        run: pipx install uv
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install tox
        run: |
          pipx install tox
          pipx inject tox tox-uv
      - name: Run unit tests
        run: tox -e unit

  pack:
    name: Pack charm
    runs-on: ubuntu-24.04
    needs:
      - lint
      - unit
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Install concierge
        run: sudo snap install --classic concierge
      - name: Prepare build environment
        run: sudo concierge prepare --disable-juju
      - name: Pack
        run: charmcraft pack -v
      - uses: actions/upload-artifact@v7
        with:
          name: charm
          path: "*.charm"
