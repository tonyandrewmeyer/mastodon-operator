name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tox
        run: |
          pipx install tox
          pipx inject tox tox-uv
      - name: Run linters
        run: tox -e lint

  lock-sync:
    name: Lockfile sync
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: pipx install uv
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tox
        run: |
          pipx install tox
          pipx inject tox tox-uv
      - name: Run unit tests
        run: tox -e unit

  pack:
    name: Pack charm
    runs-on: ubuntu-24.04
    needs:
      - lint
      - unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install concierge
        run: sudo snap install --classic concierge
      - name: Prepare build environment
        run: sudo concierge prepare --disable-juju
      - name: Pack
        run: charmcraft pack -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: charm
          path: "*.charm"
